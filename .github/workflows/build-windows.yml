name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name epic_pattern .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package executable with runtime dependencies
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          if (!(Test-Path "$source/epic_pattern.exe")) { throw "Executavel nao encontrado em $source" }
          Compress-Archive -Path "$source/*" -DestinationPath "Epic-STL-Organizer-Windows.zip" -Force

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Epic-STL-Organizer-Windows
          path: Epic-STL-Organizer-Windows.zip
          if-no-files-found: error
          retention-days: 30
